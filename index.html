<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prompt Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white min-h-screen flex flex-col font-sans">

    <div class="container mx-auto px-4 py-8 max-w-5xl flex-grow">
        <header class="flex justify-between items-center mb-10 p-6 rounded-3xl bg-[#111] border border-zinc-900 shadow-2xl">
            <div class="flex items-center cursor-pointer select-none" onclick="location.reload()">
                <span class="text-2xl font-black tracking-tighter">Prompt</span>
                <span class="text-2xl font-black text-black bg-[#ff9900] px-2 ml-1 rounded-md tracking-tighter">Hub</span>
            </div>
            <button onclick="toggleConfig()" class="text-zinc-500 hover:text-[#ff9900] font-bold transition-colors">⚙️ 同步设置</button>
        </header>

        <section id="config-section" class="hidden mb-8 p-8 bg-[#111] border border-zinc-800 rounded-3xl animate-scale-in">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-xs font-black text-zinc-500 uppercase ml-1">GitHub Token</label>
                    <input type="password" id="gh-token" placeholder="未设置" class="w-full p-4 bg-black border border-zinc-800 rounded-2xl outline-none focus:border-[#ff9900] text-sm">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-black text-zinc-500 uppercase ml-1">Gist ID</label>
                    <input type="text" id="gist-id" placeholder="未关联" class="w-full p-4 bg-black border border-zinc-800 rounded-2xl outline-none focus:border-[#ff9900] text-sm">
                </div>
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="saveConfig()" class="flex-grow bg-[#ff9900] text-black py-4 rounded-2xl font-black hover:scale-[1.01] transition-transform">保存配置</button>
                <button onclick="resetConfig()" class="px-8 py-4 bg-zinc-900 text-zinc-500 rounded-2xl font-bold border border-zinc-800">注销同步</button>
            </div>
        </section>

        <div id="status-bar" class="mb-6 p-3 rounded-2xl text-xs text-center bg-zinc-950 border border-zinc-900 text-zinc-600 hidden"></div>

        <main>
            <div class="flex flex-col md:flex-row gap-4 mb-12">
                <div class="relative flex-grow">
                    <input type="text" id="search-bar" oninput="handleSearch()" placeholder="搜索标题或内容..." class="w-full p-5 bg-[#111] border border-zinc-800 rounded-3xl outline-none focus:border-[#ff9900] pl-14">
                    <span class="absolute left-6 top-5 opacity-20 text-xl">🔍</span>
                </div>
                <button onclick="openCreateModal()" class="bg-[#ff9900] hover:bg-orange-500 text-black font-black text-lg px-10 py-5 rounded-3xl shadow-xl active:scale-95 transition-all">
                    + NEW PROMPT
                </button>
            </div>

            <div id="list-container"></div>
            <div id="empty-state" class="hidden py-32 text-center text-zinc-800 text-xl font-black">NO RESULTS FOUND</div>
        </main>
    </div>

    <div id="modal-backdrop" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4">
        <div id="modal-container" class="bg-[#111] border border-zinc-800 w-full max-w-3xl rounded-[2rem] shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="p-8 border-b border-zinc-900 flex justify-between items-center">
                <div class="flex items-center gap-4 overflow-hidden">
                    <span id="modal-category-badge" class="px-3 py-1 rounded-full text-[10px] font-black bg-zinc-900 text-[#ff9900] uppercase"></span>
                    <h3 id="modal-title" class="text-2xl font-black truncate"></h3>
                </div>
                <button onclick="closeModal()" class="text-zinc-600 hover:text-white text-3xl">✕</button>
            </div>
            <div class="p-8 overflow-y-auto custom-scrollbar flex-grow">
                <div id="view-mode-content" class="hidden markdown-body"><div id="modal-content-html"></div></div>
                <div id="edit-mode-form" class="hidden space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="p-category" list="category-suggestions" placeholder="分类..." class="p-5 bg-black border border-zinc-800 rounded-2xl outline-none focus:border-[#ff9900]">
                        <input type="text" id="p-title" placeholder="标题..." class="p-5 bg-black border border-zinc-800 rounded-2xl outline-none focus:border-[#ff9900]">
                    </div>
                    <textarea id="p-content" rows="12" placeholder="Markdown 内容..." class="w-full p-6 bg-black border border-zinc-800 rounded-2xl outline-none focus:border-[#ff9900] font-mono"></textarea>
                </div>
            </div>
            <div id="modal-footer" class="p-8 bg-zinc-950/50 flex gap-4">
                <div id="view-actions" class="hidden flex gap-4 w-full">
                    <button onclick="copyFromModal(this)" class="flex-grow bg-[#ff9900] text-black py-5 rounded-2xl font-black text-xl">一键复制</button>
                    <button onclick="switchToEditMode()" class="px-8 py-5 bg-zinc-800 rounded-2xl font-bold">编辑</button>
                    <button onclick="deleteFromModal()" class="px-8 py-5 bg-zinc-900 text-red-600 rounded-2xl font-bold">删除</button>
                </div>
                <div id="edit-actions" class="hidden flex gap-4 w-full">
                    <button onclick="handleSave()" class="flex-grow bg-[#ff9900] text-black py-5 rounded-2xl font-black">确认保存</button>
                    <button onclick="closeModal()" class="px-10 py-5 bg-zinc-800 rounded-2xl">取消</button>
                </div>
            </div>
        </div>
    </div>

    <datalist id="category-suggestions"></datalist>
    <script src="script.js"></script>
</body>
</html>
