<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt 云同步管理器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; font-family: -apple-system, sans-serif; }
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-2xl mx-auto">
        <div id="config-section" class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-lg hidden">
            <h2 class="font-bold text-amber-800 mb-2">☁️ 云同步设置</h2>
            <p class="text-xs text-amber-700 mb-3">请输入 GitHub Token 和 Gist ID 以开启多设备同步</p>
            <input type="password" id="gh-token" placeholder="GitHub Personal Access Token" class="w-full p-2 mb-2 text-sm border rounded">
            <input type="text" id="gist-id" placeholder="Gist ID (留空则自动创建)" class="w-full p-2 mb-2 text-sm border rounded">
            <button onclick="saveConfig()" class="bg-amber-600 text-white px-4 py-2 rounded text-sm w-full font-bold">保存配置并同步</button>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold text-slate-800">My AI Prompts</h1>
            <button onclick="toggleConfig()" class="text-slate-500 text-sm">⚙️ 设置</button>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border mb-6">
            <input type="hidden" id="edit-index" value="-1">
            <input type="text" id="p-title" placeholder="标题 (如: 翻译助手)" class="w-full p-2 mb-2 border-b focus:outline-none">
            <textarea id="p-content" rows="3" placeholder="输入 Prompt 内容..." class="w-full p-2 mb-3 focus:outline-none resize-none"></textarea>
            <button onclick="handleSave()" id="btn-save" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold">保存并同步到云端</button>
        </div>

        <div id="status" class="text-center text-xs text-slate-400 mb-4 italic">正在同步中...</div>
        <div id="list" class="space-y-3"></div>
    </div>

    <script>
        let prompts = [];
        let config = JSON.parse(localStorage.getItem('gist_config')) || { token: '', gistId: '' };

        // 初始化
        window.onload = () => {
            if (!config.token) {
                document.getElementById('config-section').classList.remove('hidden');
                document.getElementById('status').innerText = '未配置云端同步';
            } else {
                fetchData();
            }
        };

        function toggleConfig() {
            const section = document.getElementById('config-section');
            section.classList.toggle('hidden');
            document.getElementById('gh-token').value = config.token;
            document.getElementById('gist-id').value = config.gistId;
        }

        function saveConfig() {
            config.token = document.getElementById('gh-token').value.trim();
            config.gistId = document.getElementById('gist-id').value.trim();
            localStorage.setItem('gist_config', JSON.stringify(config));
            fetchData();
            document.getElementById('config-section').classList.add('hidden');
        }

        // 从 Gist 获取数据
        async function fetchData() {
            if (!config.token || !config.gistId) return;
            showStatus('正在从云端下载...');
            try {
                const res = await fetch(`https://api.github.com/gists/${config.gistId}`, {
                    headers: { Authorization: `token ${config.token}` }
                });
                const data = await res.json();
                const content = data.files['prompts.json'].content;
                prompts = JSON.parse(content);
                render();
                showStatus('同步成功');
            } catch (e) {
                showStatus('同步失败，请检查 Token 或 Gist ID');
            }
        }

        // 上传数据到 Gist
        async function pushData() {
            if (!config.token) {
                alert('请先配置 Token');
                return;
            }
            showStatus('正在上传到云端...');
            const method = config.gistId ? 'PATCH' : 'POST';
            const url = config.gistId ? `https://api.github.com/gists/${config.gistId}` : `https://api.github.com/gists`;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { Authorization: `token ${config.token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        description: "AI Prompts Storage",
                        public: false,
                        files: { "prompts.json": { content: JSON.stringify(prompts, null, 2) } }
                    })
                });
                const data = await res.json();
                if (!config.gistId) {
                    config.gistId = data.id;
                    localStorage.setItem('gist_config', JSON.stringify(config));
                }
                showStatus('已同步至云端');
            } catch (e) {
                showStatus('上传失败');
            }
        }

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = '';
            prompts.forEach((p, i) => {
                const div = document.createElement('div');
                div.className = 'bg-white p-4 rounded-lg shadow-sm border relative group';
                div.innerHTML = `
                    <div class="flex justify-between mb-2">
                        <span class="font-bold text-slate-700">${p.title}</span>
                        <div class="space-x-2">
                            <button onclick="copyIt(${i})" class="text-blue-500 text-xs font-bold">复制</button>
                            <button onclick="editIt(${i})" class="text-slate-400 text-xs">修改</button>
                            <button onclick="deleteIt(${i})" class="text-red-300 text-xs">删除</button>
                        </div>
                    </div>
                    <p class="text-sm text-slate-600 whitespace-pre-wrap">${p.content}</p>
                `;
                list.appendChild(div);
            });
        }

        function handleSave() {
            const title = document.getElementById('p-title').value;
            const content = document.getElementById('p-content').value;
            const idx = parseInt(document.getElementById('edit-index').value);

            if (!title || !content) return;

            if (idx === -1) {
                prompts.unshift({ title, content });
            } else {
                prompts[idx] = { title, content };
                document.getElementById('edit-index').value = "-1";
                document.getElementById('btn-save').innerText = "保存并同步到云端";
            }

            document.getElementById('p-title').value = '';
            document.getElementById('p-content').value = '';
            render();
            pushData();
        }

        function copyIt(i) {
            navigator.clipboard.writeText(prompts[i].content);
            const btn = event.target;
            btn.innerText = '已复制!';
            setTimeout(() => btn.innerText = '复制', 1000);
        }

        function editIt(i) {
            document.getElementById('p-title').value = prompts[i].title;
            document.getElementById('p-content').value = prompts[i].content;
            document.getElementById('edit-index').value = i;
            document.getElementById('btn-save').innerText = "确认修改并同步";
            window.scrollTo(0,0);
        }

        function deleteIt(i) {
            if(confirm('确定删除吗?')) {
                prompts.splice(i, 1);
                render();
                pushData();
            }
        }

        function showStatus(msg) {
            document.getElementById('status').innerText = msg;
        }
    </script>
</body>
</html>
