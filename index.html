<!DOCTYPE html>
<html lang="zh-CN" class="bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Prompt 云管理器 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-700 font-sans">

    <div class="container mx-auto px-4 py-6 max-w-5xl">
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">Prompt Hub</h1>
            </div>
            <button id="toggle-config-btn" class="flex items-center space-x-1 text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors px-3 py-2 rounded-lg hover:bg-indigo-50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                </svg>
                <span>设置</span>
            </button>
        </header>

        <section id="config-section" class="hidden mb-6 p-5 bg-indigo-50 border border-indigo-100 rounded-2xl shadow-inner animate-fade-in">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 class="font-bold text-indigo-900 text-lg">☁️ 云同步配置</h2>
                    <p class="text-sm text-indigo-700 mt-1">配置 GitHub Token 以启用跨设备同步。</p>
                </div>
                <button onclick="toggleConfigPanel()" class="text-indigo-400 hover:text-indigo-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-indigo-800 mb-1 uppercase tracking-wider">Personal Access Token (必填)</label>
                    <input type="password" id="gh-token" placeholder="以 ghp_ 开头的完整字符串" 
                        class="w-full p-3 text-sm border-2 border-indigo-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all font-mono text-indigo-900 bg-white">
                    <p class="text-xs text-indigo-600 mt-1 ml-1">* 必须勾选 <strong>gist</strong> 权限。</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-indigo-800 mb-1 uppercase tracking-wider">Gist ID (自动生成)</label>
                    <input type="text" id="gist-id" placeholder="新设备请粘贴已有的 Gist ID，首次使用请留空" 
                        class="w-full p-3 text-sm border-2 border-indigo-200 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all font-mono text-indigo-900 bg-white">
                     <p class="text-xs text-indigo-600 mt-1 ml-1">* 首次保存成功后会自动填充，其他设备请复制此 ID。</p>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button onclick="saveConfig()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-3 rounded-xl text-sm font-bold transition-transform active:scale-95 shadow-md shadow-indigo-200">保存配置并同步</button>
                    <button onclick="resetConfig()" class="px-4 py-3 rounded-xl text-sm font-bold text-red-600 hover:bg-red-50 border border-transparent hover:border-red-100 transition-colors">清空重置</button>
                </div>
            </div>
        </section>

        <main class="flex flex-col lg:flex-row gap-6 items-start">
            <section class="w-full lg:w-1/3 bg-white p-5 rounded-2xl shadow-sm border border-slate-100 sticky top-6 z-10">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                    <span id="form-title">新建 Prompt</span>
                </h2>
                <input type="hidden" id="edit-index" value="-1">
                <div class="space-y-3">
                    <input type="text" id="p-title" placeholder="标题 (例如: 英语润色)" 
                        class="w-full p-3 border border-slate-200 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all font-medium text-slate-800">
                    <textarea id="p-content" rows="6" placeholder="在此输入 Prompt 内容..." 
                        class="w-full p-3 border border-slate-200 rounded-xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all resize-none text-slate-700 leading-relaxed"></textarea>
                    
                    <div class="flex space-x-2">
                        <button onclick="handleSave()" id="btn-save" 
                            class="flex-1 bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-bold transition-transform active:scale-95 shadow-sm flex justify-center items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                            </svg>
                            保存并上传
                        </button>
                        <button onclick="cancelEdit()" id="btn-cancel" class="hidden px-4 py-3 rounded-xl font-bold text-slate-600 hover:bg-slate-100 transition-colors">
                            取消
                        </button>
                    </div>
                </div>
                 <div id="status-bar" class="mt-4 p-3 rounded-xl text-sm flex items-center justify-center bg-slate-100 text-slate-500 transition-all duration-300">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-slate-500 hidden" id="loading-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="status-text">准备就绪</span>
                </div>
            </section>

            <section class="w-full lg:w-2/3">
                 <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
                    </div>
                <div id="empty-state" class="hidden flex flex-col items-center justify-center py-12 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mb-4 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                    </svg>
                    <p>还没有 Prompt，快去创建一个吧！</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
