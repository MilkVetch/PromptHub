<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prompt Hub | Your Personal AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans min-h-screen bg-black text-white">

    <div class="container mx-auto px-4 py-6 max-w-4xl relative z-10 min-h-screen flex flex-col">
        <header class="flex justify-between items-center mb-6 p-4 rounded-xl bg-[#1b1b1b] border border-zinc-800 shadow-xl flex-shrink-0">
            <div class="flex items-center select-none cursor-pointer" onclick="location.reload()">
                <span class="text-2xl font-black tracking-tighter">Prompt</span>
                <span class="text-2xl font-black text-black bg-[#ff9900] px-2 ml-1 rounded-md tracking-tighter">Hub</span>
            </div>
            <button id="toggle-config-btn" class="text-sm font-bold text-zinc-500 hover:text-[#ff9900] transition-colors">
                ⚙️ 设置同步
            </button>
        </header>

        <section id="config-section" class="hidden mb-6 p-6 bg-[#1b1b1b] border border-zinc-800 rounded-2xl shadow-2xl animate-fade-in flex-shrink-0">
            <h2 class="font-bold text-white text-lg mb-4">☁️ GitHub Gist 配置</h2>
            <div class="space-y-4">
                <input type="password" id="gh-token" placeholder="GitHub Token (ghp_...)" 
                    class="w-full p-3 bg-black border-2 border-zinc-700 rounded-xl text-white outline-none focus:border-[#ff9900]">
                <input type="text" id="gist-id" placeholder="Gist ID (首次使用请留空)" 
                    class="w-full p-3 bg-black border-2 border-zinc-700 rounded-xl text-white outline-none focus:border-[#ff9900]">
                <div class="flex space-x-3">
                    <button onclick="saveConfig()" class="flex-1 bg-[#ff9900] text-black py-3 rounded-xl font-bold hover:bg-orange-500 transition-all">保存配置</button>
                    <button onclick="resetConfig()" class="px-4 py-3 text-zinc-400 border border-zinc-800 rounded-xl hover:text-red-500">重置</button>
                </div>
            </div>
        </section>

        <div id="status-bar" class="mb-6 p-3 rounded-xl text-sm flex items-center justify-center bg-zinc-900 border border-zinc-800 text-zinc-400 hidden flex-shrink-0">
            <span id="status-text">准备就绪</span>
        </div>

        <main class="flex-grow">
            <div class="flex flex-col md:flex-row gap-4 mb-8">
                <div class="relative flex-grow">
                    <input type="text" id="search-bar" oninput="handleSearch()" placeholder="搜索 Prompt 标题关键词..." 
                        class="w-full p-4 bg-[#1b1b1b] border-2 border-zinc-800 rounded-2xl text-white outline-none focus:border-[#ff9900] transition-all pl-12">
                    <span class="absolute left-4 top-4 opacity-30 text-xl">🔍</span>
                </div>
                <button onclick="openCreateModal()" class="bg-[#ff9900] hover:bg-orange-500 text-black font-black text-lg px-8 py-4 rounded-2xl shadow-lg transition-all active:scale-95 whitespace-nowrap">
                    + 新建 PROMPT
                </button>
            </div>

            <div id="list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
            
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-zinc-600">
                <p class="text-lg font-bold">没有发现相关的 Prompt</p>
            </div>
        </main>

        <footer class="mt-8 py-6 text-center text-zinc-600 text-sm font-bold select-none flex-shrink-0">
            <span>© Khee</span>
            <span class="text-[#ff9900] mx-1 inline-block heart-beat">❤️</span>
        </footer>

    </div>

    <div id="modal-backdrop" class="fixed inset-0 bg-black/95 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-container" class="bg-[#1b1b1b] border border-zinc-800 w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[90vh] animate-scale-in overflow-hidden">
            <div class="flex justify-between items-center p-6 border-b border-zinc-800 bg-zinc-900/50">
                <h3 id="modal-title" class="text-xl font-black text-[#ff9900] truncate mr-4">详情</h3>
                <button onclick="closeModal()" class="text-zinc-500 hover:text-white text-2xl font-bold">✕</button>
            </div>

            <div class="p-6 overflow-y-auto custom-scrollbar flex-grow text-zinc-200">
                <div id="view-mode-content" class="hidden">
                    <pre id="modal-content-text" class="whitespace-pre-wrap font-sans leading-relaxed text-lg bg-black/30 p-4 rounded-xl border border-zinc-800/50"></pre>
                </div>
                <div id="edit-mode-form" class="hidden space-y-5">
                    <input type="hidden" id="edit-index" value="-1">
                    <input type="text" id="p-title" placeholder="Prompt 标题..." 
                        class="w-full p-4 bg-black border-2 border-zinc-800 rounded-xl text-white outline-none focus:border-[#ff9900] text-xl font-bold">
                    <textarea id="p-content" rows="12" placeholder="在此粘贴你的 AI Prompt 指令内容..." 
                        class="w-full p-4 bg-black border-2 border-zinc-800 rounded-xl text-white outline-none focus:border-[#ff9900] resize-none custom-scrollbar leading-relaxed"></textarea>
                </div>
            </div>

            <div id="modal-footer" class="p-6 border-t border-zinc-800 bg-zinc-900/80 flex space-x-3">
                <div id="view-actions" class="hidden flex space-x-3 w-full">
                    <button onclick="copyFromModal(this)" class="flex-grow bg-[#ff9900] text-black py-4 rounded-xl font-black text-lg hover:bg-orange-500 transition-all">一键复制内容</button>
                    <button onclick="switchToEditMode()" class="px-6 py-4 bg-zinc-800 text-white rounded-xl font-bold hover:bg-zinc-700 transition-all">修改</button>
                    <button onclick="deleteFromModal()" class="px-6 py-4 bg-zinc-900 text-red-600 rounded-xl font-bold hover:bg-red-950 transition-all">删除</button>
                </div>
                <div id="edit-actions" class="hidden flex space-x-3 w-full">
                    <button onclick="handleSave()" id="btn-save" class="flex-grow bg-[#ff9900] text-black py-4 rounded-xl font-black text-lg hover:bg-orange-500">确认保存</button>
                    <button onclick="closeModal()" class="px-8 py-4 bg-zinc-800 text-white rounded-xl font-bold hover:bg-zinc-700">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
